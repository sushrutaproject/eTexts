title: "e-Caraka"
tagline: "The Carakasaṃhitā, in IAST"
description: >
  A digital reading edition of the Carakasaṃhitā, a Sanskrit treatise on
  medicine, with Cakrapāṇidatta's commentary, the Āyurvedadīpikā.
  Text and translit. conversion sourced from the NIIMH e-Samhita
  (niimh.res.in); see the About page for scope and known limitations.

baseurl: "/eCaraka"
url: ""

markdown: kramdown
kramdown:
  input: GFM

collections:
  sutrasthanam:
    output: true
    permalink: /:collection/:name/
  nidanasthanam:
    output: true
    permalink: /:collection/:name/
  vimanasthanam:
    output: true
    permalink: /:collection/:name/
  sarirasthanam:
    output: true
    permalink: /:collection/:name/
  indriyasthanam:
    output: true
    permalink: /:collection/:name/
  cikitsasthanam:
    output: true
    permalink: /:collection/:name/
  kalpasthanam:
    output: true
    permalink: /:collection/:name/
  siddhisthanam:
    output: true
    permalink: /:collection/:name/

defaults:
  - scope:
      path: ""
      type: sutrasthanam
    values:
      layout: chapter
      sthana_slug: sutrasthanam
  - scope:
      path: ""
      type: nidanasthanam
    values:
      layout: chapter
      sthana_slug: nidanasthanam
  - scope:
      path: ""
      type: vimanasthanam
    values:
      layout: chapter
      sthana_slug: vimanasthanam
  - scope:
      path: ""
      type: sarirasthanam
    values:
      layout: chapter
      sthana_slug: sarirasthanam
  - scope:
      path: ""
      type: indriyasthanam
    values:
      layout: chapter
      sthana_slug: indriyasthanam
  - scope:
      path: ""
      type: cikitsasthanam
    values:
      layout: chapter
      sthana_slug: cikitsasthanam
  - scope:
      path: ""
      type: kalpasthanam
    values:
      layout: chapter
      sthana_slug: kalpasthanam
  - scope:
      path: ""
      type: siddhisthanam
    values:
      layout: chapter
      sthana_slug: siddhisthanam
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - build_tei.py
  - README.md
  - INSTALL.md
  - Gemfile
  - Gemfile.lock
  - scrape_ecaraka.py
  - build_ecaraka.py
  - scrape-log.txt
  - ecaraka_data
  - ecaraka_data.zip
  - NIIMH_conversion_handover.md
