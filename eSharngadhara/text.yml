# Settings for e-Śārṅgadhara. The text itself is sarngadharasamhita-full.xml,
# the master copy: the reading pages, the search index and both downloads
# are made from it by tools/tei2site.py at every build. See
# tools/text.yml.example for what each setting does.

tei: sarngadharasamhita-full.xml

site_title: "e-Śārṅgadhara"
work: "Śārṅgadharasaṃhitā"
commentary: "with Āḍhamalla's Dīpikā and Kāśīrāma's Gūḍhārthadīpikā"
tagline: "The Śārṅgadharasaṃhitā, with two commentaries, in IAST"
home_subtitle: "A reading edition of the Śārṅgadharasaṃhitā, in IAST"   # under the title on the home page
blurb: >
  Śārṅgadhara's handbook of pharmacy and therapeutics, in three
  khaṇḍas.
source: "CCRAS e-book reading room"
description: >
  A digital reading edition of the Śārṅgadharasaṃhitā of Śārṅgadhara, a
  Sanskrit treatise on medicine and pharmacy, with the commentaries of
  Āḍhamalla (Dīpikā) and Kāśīrāma (Gūḍhārthadīpikā). Text sourced from
  the CCRAS e-book reading room; see the About page for scope and
  known limitations.

intro: |
  <p>
    The Śārṅgadharasaṃhitā of Śārṅgadhara, a Sanskrit treatise on medicine and
    pharmacy, is organized into three khaṇḍas (sections). It is read here
    alongside two commentaries: Āḍhamalla's
    <em>Dīpikā</em> and Kāśīrāma's <em>Gūḍhārthadīpikā</em>. All three are
    distinguished typographically. Choose a khaṇḍa below to browse its adhyāyas
    (chapters).
  </p>
  <p>
    The source of the etext is the
    <a href="http://n2t.net/ark:/13960/t7wn11g9r" target="_blank">1931 edition of Paraśurāma Śāstrī</a>.
  </p>
footer: >
  Text and IAST conversion sourced from the
  <a href="http://ccras.res.in/ccras_ebooks/readSam" target="_blank" rel="noopener">CCRAS e-book reading room</a>.
  See the <a href="{{ '/about/' | relative_url }}">About</a> page for scope and
  known limitations.
about: about.md
copy: [LICENSE]

# Section addresses (…/eSharngadhara/<slug>/) are those of the earlier site.
section_word: "Khaṇḍa"
chapter_word: "adhyāyas"
sections:
  - {slug: purvakhanda, name: "Pūrvakhaṇḍa", subtitle: "Fundamentals and Diagnosis"}
  - {slug: madhyamakhanda, name: "Madhyamakhaṇḍa", subtitle: "Pharmaceutical Preparations"}
  - {slug: uttarakhanda, name: "Uttarakhaṇḍa", subtitle: "Therapeutic Procedures"}

pages: pages.yml
title_format: "{n}. {title}"
notes_heading: "Editor's notes"

commentaries:
  dipika:
    name: "Āḍhamalla's Dīpikā"
    toggle: "Show Āḍhamalla"
    legend: "Āḍhamalla.: Āḍhamalla's Dīpikā"
    absent_note: "not present for this chapter in the source"
  gudharthadipika:
    name: "Kāśīrāma's Gūḍhārthadīpikā"
    toggle: "Show Kāśīrāma"
    legend: "Kāśīrāma Vaidya.: Kāśīrāma's Gūḍhārthadīpikā"
    absent_note: "not present for this chapter in the source"
  unattributed:
    name: "comment of uncertain attribution"
    toggle: "Show unattributed comment"
    legend: "unlabelled: uncertain attribution"

# As on the earlier site: both commentaries smaller and indented, but the
# rule and the label are muted for Āḍhamalla and gold for Kāśīrāma.
extra_css: |
  .bhasya { margin: 1.2rem 0 1.2rem 1.5rem; }
  .bhasya.comm-2 { border-left-color: var(--accent); }
  .chapter-text .commentator-label {
    display: inline-block;
    font-weight: 700;
    font-style: italic;
    font-size: 0.82em;
    margin-right: 0.4em;
  }
  .chapter-text .comm-1 .commentator-label { color: var(--muted); }
  .chapter-text .comm-2 .commentator-label { color: var(--accent); }

mula:
  file: sarngadharasamhita-mula.xml
  label: "Mūla only"
tei_label: "Mūla with Āḍhamalla's and Kāśīrāma's commentaries"
tei_label_short: "Mūla with commentaries"   # on the collection home page
download_note: "Download the complete text as a single, validating TEI&nbsp;P5 XML file:"
