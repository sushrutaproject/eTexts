title: "e-Suśruta"
tagline: "The Suśrutasaṃhitā, in IAST"
description: >
  A digital reading edition of the Suśrutasaṃhitā, a Sanskrit treatise on
  medicine and surgery, with Ḍalhaṇa's commentary, the Nibandhasaṅgraha.
  Text and translit. conversion sourced from the NIIMH e-Samhita
  (niimh.res.in); see the About page for scope and known limitations.

baseurl: ""
url: ""

markdown: kramdown
kramdown:
  input: GFM

collections:
  sutrasthana:
    output: true
    permalink: /:collection/:name/
  nidanasthana:
    output: true
    permalink: /:collection/:name/
  sharirasthana:
    output: true
    permalink: /:collection/:name/
  cikitsasthana:
    output: true
    permalink: /:collection/:name/
  kalpasthana:
    output: true
    permalink: /:collection/:name/
  uttaratantra:
    output: true
    permalink: /:collection/:name/

defaults:
  - scope:
      path: ""
      type: sutrasthana
    values:
      layout: chapter
      sthana_slug: sutrasthana
  - scope:
      path: ""
      type: nidanasthana
    values:
      layout: chapter
      sthana_slug: nidanasthana
  - scope:
      path: ""
      type: sharirasthana
    values:
      layout: chapter
      sthana_slug: sharirasthana
  - scope:
      path: ""
      type: cikitsasthana
    values:
      layout: chapter
      sthana_slug: cikitsasthana
  - scope:
      path: ""
      type: kalpasthana
    values:
      layout: chapter
      sthana_slug: kalpasthana
  - scope:
      path: ""
      type: uttaratantra
    values:
      layout: chapter
      sthana_slug: uttaratantra
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - build_site.py
  - build_site_v2.py
  - esushruta_data
  - esushruta_data_v2
