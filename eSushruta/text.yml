# Settings for e-Suśruta. The text itself is susrutasamhita-full.xml, the
# master copy: the reading pages, the search index and both downloads are
# made from it by tools/tei2site.py at every build. See tools/text.yml.example
# for what each setting does.

tei: susrutasamhita-full.xml

site_title: "e-Suśruta"
work: "Suśrutasaṃhitā"
commentary: "with Ḍalhaṇa's Nibandhasaṅgraha"
tagline: "The Suśrutasaṃhitā, in IAST"
home_subtitle: "A reading edition of the Suśrutasaṃhitā, in IAST"   # under the title on the home page
blurb: >
  The classical treatise on medicine and surgery, read with Ḍalhaṇa's
  twelfth-century commentary. Based on the 1938 edition of
  Yādavaśarman Trivikrama Ācārya.
source: "NIIMH e-Samhita"
description: >
  A digital reading edition of the Suśrutasaṃhitā, a Sanskrit treatise on
  medicine and surgery, with Ḍalhaṇa's commentary, the Nibandhasaṅgraha.
  Text and translit. conversion sourced from the NIIMH e-Samhita
  (niimh.res.in); see the About page for scope and known limitations.

intro: |
  <p>
    The Suśrutasaṃhitā, a Sanskrit treatise on medicine and surgery, is
    organized into six sthānas (sections). It is read here alongside Ḍalhaṇa's
    twelfth-century commentary, the Nibandhasaṅgraha, with the two distinguished
    typographically. Choose a sthāna below to browse its adhyāyas (chapters).
  </p>
  <p>
    The text below is based on the 1938 edition of the Suśrutasaṃhitā edited by
    Yādavaśarman Trivikrama Ācārya (see
    <a href="https://sushrutaproject1.github.io/Sushrutasamhita_Saktumiva2/06-su.ut-27-37-kumara/06-ut-vulgate-1938-27-37.xml?facs=1" target="_blank">scan at the Wellcome Library, London</a>).
  </p>
footer: >
  Text and IAST conversion sourced from the
  <a href="http://niimh.res.in/ebooks/esushruta/" target="_blank" rel="noopener">NIIMH e-Samhita</a>
  (National Institute of Indian Medical Heritage). See the
  <a href="{{ '/about/' | relative_url }}">About</a> page for scope and known
  limitations.
about: about.md

# Section addresses (…/eSushruta/<slug>/) are those of the earlier site.
section_word: "Sthāna"
chapter_word: "adhyāyas"
sections:
  - {slug: sutrasthana, name: "Sūtrasthāna", subtitle: "General Principles"}
  - {slug: nidanasthana, name: "Nidānasthāna", subtitle: "Diagnosis"}
  - {slug: sharirasthana, name: "Śārīrasthāna", subtitle: "Anatomy"}
  - {slug: cikitsasthana, name: "Cikitsāsthāna", subtitle: "Therapeutics"}
  - {slug: kalpasthana, name: "Kalpasthāna", subtitle: "Toxicology & Pharmaceutics"}
  - {slug: uttaratantra, name: "Uttaratantram", subtitle: "Supplementary Section"}

pages: pages.yml
title_format: "{n}. {title}"
notes_heading: "pāṭhāntarāḥ"

commentaries:
  nibandhasangraha:
    name: "Ḍalhaṇa's Nibandhasaṅgraha"
    toggle: "Show commentary"
    legend: "indented: Ḍalhaṇa's Nibandhasaṅgraha"

mula:
  file: susrutasamhita-mula.xml
  label: "Mūla only"
tei_label: "Mūla with Ḍalhaṇa's commentary"
tei_label_short: "Mūla with commentary"   # on the collection home page
download_note: "Download the complete text as a single, validating TEI&nbsp;P5 XML file:"
