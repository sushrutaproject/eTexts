<header class="site-header">
  <div class="umbrella">
    <nav class="umbrella-inner" aria-label="Suśruta Project websites">
      <a class="umbrella-home" href="https://sushrutaproject.github.io/"><span lang="sa">सुश्रुत</span> The Suśruta Project</a>
      <ul>
        <li><a href="https://github.com/sushrutaproject1/Sushrutasamhita_Saktumiva1/raw/main/translation/incremental_SS_Translation.pdf?raw=true">Translation</a></li>
        <li><a href="https://sushrutaproject1.github.io/Sushrutasamhita_Saktumiva2/">Edition</a></li>
        <li><a href="https://sushrutaproject1.github.io/">Project 1</a></li>
        <li><a href="https://sushrutaproject2.github.io/">Project 2</a></li>
      </ul>
    </nav>
  </div>
  <div class="site-header-inner">
    <div class="brand">
      <a class="brand-mark" href="{{ '/' | relative_url }}" lang="sa" aria-hidden="true" tabindex="-1">सु</a>
      <div class="brand-text">
    <div class="site-title">
      <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
    </div>
    <p class="site-tagline">{{ site.tagline }}</p>
      </div>
    </div>
    <nav class="site-nav">
      {% for t in site.data.corpus %}
      <a href="{{ t.id | prepend: '/' | append: '/' | relative_url }}"
        >{{ t.work }}</a
      >
      {% endfor %}
      <a href="{{ '/search/' | relative_url }}">Search</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
    </nav>
    {% unless page.hide_header_search %}
    <form
      class="header-search"
      action="{{ '/search/' | relative_url }}"
      method="get"
      role="search"
    >
      <label for="header-q" class="sr-only">Search all texts</label>
      <input
        type="search"
        id="header-q"
        name="q"
        placeholder="Search all texts…"
      />
      <input type="hidden" name="scope" value="all" />
      <button type="submit">Go</button>
    </form>
    {% endunless %}
  </div>
</header>
