<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search &middot; e-Mādhavanidāna</title>
  <meta name="description" content="A digital reading edition of the Mādhavanidāna, Mādhavakara's Sanskrit compendium of disease diagnosis and nosology, together with the Madhukośa and Ātaṅkada...">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/madhava/assets/css/style.css">
</head>
<body>
  <header class="site-header">
  <div class="site-header-inner">
    <div class="site-title"><a href="/madhava/">e-Mādhavanidāna</a></div>
    <p class="site-tagline">The Mādhavanidāna, in IAST</p>
    <nav class="site-nav">
      <a href="/madhava/">Chapters</a>
      <a href="/madhava/about/">About</a>
    </nav>
    <form class="header-search" action="/madhava/search/" method="get" role="search">
      <label for="header-q" class="sr-only">Search the text</label>
      <input type="search" id="header-q" name="q" placeholder="Search…">
      <button type="submit">Go</button>
    </form>
  </div>
</header>

  <main>
    <div class="search-page">
  <h1>Search</h1>

  <form class="search-form" id="search-form" autocomplete="off">
    <div class="search-row">
      <input type="search" id="q" name="q" placeholder="Search the text…" aria-label="Search terms">
      <button type="submit">Search</button>
    </div>

    <div class="search-options">
      <fieldset>
        <legend>Match</legend>
        <label><input type="radio" name="mode" value="plain" checked> Plain text</label>
        <label><input type="radio" name="mode" value="regex"> Regular expression</label>
      </fieldset>

      <fieldset>
        <legend>Diacritics</legend>
        <label><input type="checkbox" id="fold" name="fold"> Ignore diacritics</label>
      </fieldset>
    </div>
    <p class="search-hint" id="search-hint"></p>
  </form>

  <div id="search-status" class="search-status" role="status" aria-live="polite"></div>
  <div id="search-results" class="search-results"></div>
</div>

<script>
(function () {
  "use strict";

  var INDEX_URL = "/madhava/search-index/nidanas.json";
  var MAX_MATCHES_PER_CHAPTER = 25;
  var MAX_TOTAL_MATCHES = 500;
  var CONTEXT = 70;

  var form = document.getElementById("search-form");
  var qInput = document.getElementById("q");
  var foldBox = document.getElementById("fold");
  var statusEl = document.getElementById("search-status");
  var resultsEl = document.getElementById("search-results");
  var hintEl = document.getElementById("search-hint");

  var indexData = null;

  var foldCache = {};
  function foldChar(c) {
    if (foldCache[c] !== undefined) return foldCache[c];
    var f = c.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    if (f.length !== 1) f = c;
    foldCache[c] = f;
    return f;
  }
  function foldText(s) {
    var out = "";
    var plainFrom = 0;
    for (var i = 0; i < s.length; i++) {
      if (s.charCodeAt(i) < 128) continue;
      out += s.slice(plainFrom, i) + foldChar(s[i]);
      plainFrom = i + 1;
    }
    return plainFrom === 0 ? s : out + s.slice(plainFrom);
  }
  function foldedTextOf(chapter) {
    if (chapter._folded === undefined) chapter._folded = foldText(chapter.text);
    return chapter._folded;
  }

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function escapeRegex(s) {
    return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }
  function getMode() {
    var checked = form.querySelector('input[name="mode"]:checked');
    return checked ? checked.value : "plain";
  }
  function buildRegex(query, mode, fold) {
    var source = (mode === "regex") ? query : escapeRegex(query);
    if (fold) source = foldText(source);
    return new RegExp(source, "gi");
  }

  function loadIndex() {
    if (indexData) return Promise.resolve(indexData);
    return fetch(INDEX_URL)
      .then(function (r) {
        if (!r.ok) throw new Error("Could not load search index (" + r.status + ")");
        return r.json();
      })
      .then(function (data) {
        indexData = data;
        return data;
      });
  }

  function makeSnippet(text, start, end) {
    var from = Math.max(0, start - CONTEXT);
    var to = Math.min(text.length, end + CONTEXT);
    var before = (from > 0 ? "… " : "") + escapeHtml(text.slice(from, start));
    var hit = escapeHtml(text.slice(start, end));
    var after = escapeHtml(text.slice(end, to)) + (to < text.length ? " …" : "");
    return before + "<mark>" + hit + "</mark>" + after;
  }

  function searchChapter(chapter, re, fold) {
    var haystack = fold ? foldedTextOf(chapter) : chapter.text;
    re.lastIndex = 0;
    var matches = [];
    var m;
    var guard = 0;
    while ((m = re.exec(haystack)) !== null) {
      if (m.index === re.lastIndex) re.lastIndex++;
      if (m[0].length === 0) continue;
      if (matches.length < MAX_MATCHES_PER_CHAPTER) {
        matches.push(makeSnippet(chapter.text, m.index, m.index + m[0].length));
      }
      guard++;
      if (guard > 5000) break;
    }
    return { snippets: matches, total: guard };
  }

  function render(query, mode, fold, chapters, totalHits, shownHits, truncated) {
    if (totalHits === 0) {
      resultsEl.innerHTML = "";
      statusEl.textContent = "No matches.";
      return;
    }

    var summary = totalHits + (totalHits === 1 ? " match" : " matches");
    if (shownHits < totalHits) summary += " (showing first " + shownHits + ")";
    if (fold) summary += ", ignoring diacritics";
    statusEl.textContent = summary;

    var html = "";
    chapters.forEach(function (c) {
      var link = c.url + "?q=" + encodeURIComponent(query) + "&mode=" + mode +
                 (fold ? "&fold=1" : "");
      html += '<article class="result-chapter">';
      html += '<h3><a href="' + link + '">' + escapeHtml(c.title) + "</a>";
      html += ' <span class="hit-count">' + c.total +
              (c.total === 1 ? " hit" : " hits") + "</span></h3>";
      html += '<ul class="hit-list">';
      c.snippets.forEach(function (s) {
        html += "<li>" + s + "</li>";
      });
      if (c.total > c.snippets.length) {
        html += '<li class="more">… and ' + (c.total - c.snippets.length) +
                " more in this chapter</li>";
      }
      html += "</ul></article>";
    });

    if (truncated) {
      html += '<p class="search-truncated">Result list truncated at ' +
              MAX_TOTAL_MATCHES + " snippets. Narrow your search to see the rest.</p>";
    }
    resultsEl.innerHTML = html;
  }

  function runSearch(query, mode, fold) {
    if (!query) {
      resultsEl.innerHTML = "";
      statusEl.textContent = "";
      return;
    }

    var re;
    try {
      re = buildRegex(query, mode, fold);
    } catch (err) {
      resultsEl.innerHTML = "";
      statusEl.textContent = "Invalid regular expression: " + err.message;
      return;
    }

    statusEl.textContent = "Loading…";
    resultsEl.innerHTML = "";

    loadIndex().then(
      function (data) {
        var chapters = [];
        var totalHits = 0;
        var shownHits = 0;
        var truncated = false;

        data.forEach(function (chapter) {
          var res = searchChapter(chapter, re, fold);
          if (res.total === 0) return;
          totalHits += res.total;

          var snippets = res.snippets;
          if (shownHits + snippets.length > MAX_TOTAL_MATCHES) {
            snippets = snippets.slice(0, Math.max(0, MAX_TOTAL_MATCHES - shownHits));
            truncated = true;
          }
          shownHits += snippets.length;

          if (snippets.length > 0) {
            chapters.push({
              title: chapter.title,
              url: chapter.url,
              total: res.total,
              snippets: snippets
            });
          }
        });

        render(query, mode, fold, chapters, totalHits, shownHits, truncated);
      },
      function (err) {
        statusEl.textContent = "Could not load the text to search: " + err.message;
      }
    );
  }

  function updateHint() {
    var bits = [];
    if (getMode() === "regex") {
      bits.push("JavaScript regex syntax, case-insensitive. e.g. vy[āa]dhi or ka[sś]āya");
    }
    if (foldBox.checked) {
      bits.push("Typing plain letters matches accented ones: dosa finds doṣa, sarira finds śarīra.");
    }
    hintEl.textContent = bits.join(" ");
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var query = qInput.value.trim();
    var mode = getMode();
    var fold = foldBox.checked;
    var url = "?q=" + encodeURIComponent(query) + "&mode=" + mode +
              (fold ? "&fold=1" : "");
    history.replaceState(null, "", url);
    runSearch(query, mode, fold);
  });

  Array.prototype.forEach.call(form.querySelectorAll('input[name="mode"]'), function (el) {
    el.addEventListener("change", updateHint);
  });
  foldBox.addEventListener("change", updateHint);

  var params = new URLSearchParams(window.location.search);
  var q0 = params.get("q") || "";
  var mode0 = params.get("mode") === "regex" ? "regex" : "plain";
  var fold0 = params.get("fold") === "1";

  qInput.value = q0;
  var modeEl = form.querySelector('input[name="mode"][value="' + mode0 + '"]');
  if (modeEl) modeEl.checked = true;
  foldBox.checked = fold0;
  updateHint();

  if (q0) runSearch(q0, mode0, fold0);
  qInput.focus();
})();
</script>

  </main>
  <footer class="site-footer">
  <p>
    Text and IAST conversion sourced from the
    <a href="http://niimh.res.in/ebooks/madhavanidana/" target="_blank" rel="noopener">NIIMH e-Samhita</a>
    (National Institute of Indian Medical Heritage). See the
    <a href="/madhava/about/">About</a> page for scope and known limitations.
  </p>
</footer>

</body>
</html>
