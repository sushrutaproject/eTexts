<header class="site-header">
  <div class="site-header-inner">
    <div class="site-title"><a class="corpus-link" href="{{ site.corpus_root }}/">eTexts</a> <span class="corpus-sep">/</span> <a href="{{ '/' | relative_url }}">e-Mādhavanidāna</a></div>
    <p class="site-tagline">{{ site.tagline }}</p>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}">Chapters</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
    </nav>
    <form class="header-search" action="{{ site.corpus_root }}/search/" method="get" role="search">
      <label for="header-q" class="sr-only">Search the text</label>
      <input type="search" id="header-q" name="q" placeholder="Search this text…">
      <input type="hidden" name="scope" value="{{ site.text_id }}{% if page.sthana_slug %}/{{ page.sthana_slug }}{% endif %}">
      <button type="submit">Go</button>
    </form>
  </div>
</header>
