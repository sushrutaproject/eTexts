# ------------------------------------------------------------------
# eTexts -- the register of texts in this collection.
#
# Each entry is one sub-site living in its own directory of this repo.
# The directory name (`id`) is also its URL segment, e.g.
#   https://sushrutaproject.github.io/eTexts/eSushruta/
#
# The order here is the order on the home page and in the search menu.
#
# Every text is made from a TEI file (a folder holding the TEI file and,
# optionally, a text.yml with its settings, see tools/text.yml.example).
# Texts are found automatically and need no entry here; listing one
# (`- id: eBhela`) fixes its place in the order. Anything else given here
# (site_title, work, commentary, blurb, source, tei) overrides what its
# text.yml or TEI header says, but is best put in text.yml.
#
# Searchable sections are NOT listed here: they are read at build time
# from the sections of each text, and each section publishes
#   <id>/search-index/<section>.json .
#
# A hand-built Jekyll site (a folder with its own _config.yml) is still
# built as it stands; see README.md, "Adding a hand-built text".
# ------------------------------------------------------------------

- id: eCaraka
- id: eSushruta
- id: eHrdaya
- id: eMadhava
- id: eSharngadhara
