# Build every text plus the portal with build.rb and publish to GitHub Pages.
# Folders holding just a TEI file are converted into reading sites on the
# way (tools/tei2site.py), so pushing a new folder with a TEI file in it
# adds a text. Problems with one TEI text show as annotations on the run
# summary page; the rest of the collection is still published.
#
# One-time setup in the repository on GitHub:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"

name: Build and deploy eTexts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install the TEI converter's Python packages
        run: pip install -r tools/requirements.txt

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build all texts and the portal
        run: bundle exec ruby build.rb --base "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
